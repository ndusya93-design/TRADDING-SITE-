<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DollarTrade — Pro Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   RESET & TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;
  --panel:#0e131d;
  --panel-2:#131a26;
  --panel-3:#182130;
  --border:#1b2431;
  --border-2:#232f40;
  --text:#e8eef7;
  --text-2:#9aa9bd;
  --muted:#5f6d80;
  --green:#16c784;
  --green-soft:rgba(22,199,132,.12);
  --red:#ea3943;
  --red-soft:rgba(234,57,67,.12);
  --blue:#3d7eff;
  --gold:#f0b90b;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  font-size:13px;line-height:1.4;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232f40;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#33445c}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- TOP BAR ---------- */
.topbar{
  flex:0 0 56px;height:56px;
  display:flex;align-items:center;gap:20px;
  padding:0 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.brand .logo{
  width:29px;height:29px;border-radius:9px;
  background:linear-gradient(135deg,#1ddb92,#0d8f5f);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:#04140e;
  box-shadow:0 4px 16px rgba(22,199,132,.32);
}
.brand em{font-style:normal;color:var(--green)}

.mainnav{display:flex;gap:2px}
.mainnav a{
  padding:7px 12px;border-radius:8px;color:var(--text-2);
  text-decoration:none;font-weight:500;font-size:13px;
  transition:.15s;cursor:pointer;white-space:nowrap;
}
.mainnav a:hover{color:var(--text);background:var(--panel-3)}
.mainnav a.active{color:var(--text);background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--border-2)}

.topsearch{margin-left:auto;position:relative;display:flex;align-items:center}
.topsearch svg{position:absolute;left:11px;width:14px;height:14px;color:var(--muted);pointer-events:none}
.topsearch input{
  width:210px;height:34px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);padding:0 12px 0 34px;font-size:12.5px;
  outline:none;transition:.18s;
}
.topsearch input::placeholder{color:var(--muted)}
.topsearch input:focus{border-color:var(--blue);width:250px;background:#0b1017;box-shadow:0 0 0 3px rgba(61,126,255,.1)}

.topright{display:flex;align-items:center;gap:14px}
.balance{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;white-space:nowrap}
.balance .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.balance .amt{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);background:var(--panel-2);border:1px solid var(--border);
  transition:.15s;position:relative;
}
.icon-btn:hover{color:var(--text);background:var(--panel-3)}
.icon-btn .dot{
  position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 2px var(--panel-2);
}
.avatar{
  width:33px;height:33px;border-radius:50%;
  background:linear-gradient(135deg,#3d7eff,#8b5cf6);
  display:grid;place-items:center;font-size:11px;font-weight:700;
  cursor:pointer;letter-spacing:.3px;transition:.15s;
}
.avatar:hover{transform:scale(1.06)}

/* ---------- TICKER STRIP ---------- */
.ticker{
  flex:0 0 34px;height:34px;
  background:var(--panel-2);
  border-bottom:1px solid var(--border);
  overflow:hidden;position:relative;display:flex;align-items:center;
}
.ticker::before,.ticker::after{
  content:'';position:absolute;top:0;bottom:0;width:50px;z-index:2;pointer-events:none;
}
.ticker::before{left:0;background:linear-gradient(90deg,var(--panel-2),transparent)}
.ticker::after{right:0;background:linear-gradient(270deg,var(--panel-2),transparent)}
.ticker-track{
  display:flex;gap:26px;white-space:nowrap;padding-left:16px;
  animation:marquee 70s linear infinite;will-change:transform;
}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick-item{display:flex;gap:8px;align-items:center;font-size:12px;font-family:var(--mono)}
.tick-item .sym{color:var(--text-2);font-family:'Inter',sans-serif;font-weight:600;font-size:12px}
.tick-item .up{color:var(--green)}
.tick-item .down{color:var(--red)}

/* ---------- MAIN LAYOUT ---------- */
.layout{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:248px minmax(0,1fr) 344px;
  gap:1px;background:var(--border);
}
.col{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}

.p-head{
  flex:0 0 40px;height:40px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;border-bottom:1px solid var(--border);
}
.p-title{font-size:12px;font-weight:600;letter-spacing:.2px}
.p-badge{
  font-size:10px;font-weight:600;color:var(--muted);
  background:var(--panel-3);padding:2px 7px;border-radius:20px;
}
.live-dot{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:600;color:var(--green);letter-spacing:.5px;
}
.live-dot i{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  animation:pulse 1.8s infinite;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,199,132,.5)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(22,199,132,0)}}

/* ============================================================
   WATCHLIST
   ============================================================ */
.wl-search{padding:8px 10px;border-bottom:1px solid var(--border)}
.wl-search input{
  width:100%;height:30px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:0 10px;font-size:12px;outline:none;transition:.15s;
}
.wl-search input::placeholder{color:var(--muted)}
.wl-search input:focus{border-color:var(--border-2);background:#0b1017}

.wl-list{flex:1;overflow-y:auto;min-height:0}
.wl-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 13px;cursor:pointer;
  border-left:2px solid transparent;
  transition:background .13s;
}
.wl-row:hover{background:var(--panel-2)}
.wl-row.active{background:var(--panel-3);border-left-color:var(--green)}
.wl-sym{display:flex;flex-direction:column;gap:2px;min-width:0}
.wl-sym b{font-size:12.5px;font-weight:600;letter-spacing:-.1px}
.wl-sym small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.wl-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wl-price{font-family:var(--mono);font-size:12px;font-weight:500;transition:color .35s}
.wl-chg{font-family:var(--mono);font-size:10.5px}
.wl-chg.up{color:var(--green)}
.wl-chg.down{color:var(--red)}

/* ============================================================
   CHART COLUMN
   ============================================================ */
.chart-col{background:var(--panel)}

.chart-head{
  flex:0 0 auto;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
}
.pair-info{display:flex;align-items:center;gap:11px}
.pair-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#1c2839,#111925);
  border:1px solid var(--border-2);
  display:grid;place-items:center;
  font-weight:700;font-size:12px;color:var(--green);letter-spacing:-.5px;
}
.pair-name{display:flex;align-items:center;gap:8px}
.pair-name b{font-size:15px;font-weight:700;letter-spacing:-.3px}
.pair-name .tag{
  font-size:9.5px;font-weight:600;color:var(--gold);
  background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.2);
  padding:1px 6px;border-radius:5px;letter-spacing:.4px;
}
.pair-sub{font-size:10.5px;color:var(--muted);margin-top:1px}

.price-block{display:flex;flex-direction:column;gap:1px}
.big-price{
  font-family:var(--mono);font-size:20px;font-weight:600;
  letter-spacing:-.6px;line-height:1.1;transition:color .35s;
}
.price-chg{font-family:var(--mono);font-size:11px;font-weight:500}
.price-chg.up{color:var(--green)}
.price-chg.down{color:var(--red)}

.chart-stats{display:flex;gap:22px}
.chart-stats > div{display:flex;flex-direction:column;gap:2px}
.chart-stats span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.chart-stats b{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--text-2)}

.tf-bar{margin-left:auto;display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:9px;border:1px solid var(--border)}
.tf-bar button{
  padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;
  color:var(--muted);transition:.14s;letter-spacing:.2px;
}
.tf-bar button:hover{color:var(--text-2)}
.tf-bar button.active{background:var(--panel-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}

.chart-wrap{flex:1;min-height:0;position:relative;overflow:hidden}
#chart{width:100%;height:100%;display:block;cursor:crosshair}

.chart-legend{
  position:absolute;top:10px;left:12px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;color:var(--text-2);
  background:rgba(14,19,29,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:5px 11px;border-radius:8px;border:1px solid var(--border);
  pointer-events:none;max-width:calc(100% - 90px);
}
.chart-legend span{white-space:nowrap}
.chart-legend b{color:var(--text);font-weight:500}
.chart-legend .lbl{color:var(--muted)}

/* ---------- BOTTOM PANEL ---------- */
.bottom-panel{
  flex:0 0 186px;height:186px;
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
  background:var(--panel);
}
.bp-tabs{
  flex:0 0 38px;display:flex;align-items:center;gap:2px;
  padding:0 10px;border-bottom:1px solid var(--border);
}
.bp-tabs button{
  padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;
  color:var(--muted);transition:.14s;position:relative;
}
.bp-tabs button:hover{color:var(--text-2)}
.bp-tabs button.active{color:var(--text);background:var(--panel-3)}
.bp-tabs .count{
  font-size:9.5px;font-family:var(--mono);background:var(--green-soft);
  color:var(--green);padding:1px 5px;border-radius:4px;margin-left:5px;font-weight:600;
}
.bp-body{flex:1;overflow-y:auto;min-height:0}

table{width:100%;border-collapse:collapse}
thead th{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);font-weight:600;text-align:left;
  padding:8px 14px;position:sticky;top:0;
  background:var(--panel);border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{
  padding:9px 14px;font-size:12px;
  border-bottom:1px solid rgba(27,36,49,.55);
  white-space:nowrap;
}
tbody tr:hover{background:rgba(255,255,255,.017)}
.num{font-family:var(--mono);text-align:right}
th.num{text-align:right}
.sym-cell{font-weight:600;font-size:12px}
.side-tag{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:2px 7px;border-radius:5px;text-transform:uppercase;
}
.side-tag.long{background:var(--green-soft);color:var(--green)}
.side-tag.short{background:var(--red-soft);color:var(--red)}
.pnl-pos{color:var(--green);font-family:var(--mono);font-weight:600}
.pnl-neg{color:var(--red);font-family:var(--mono);font-weight:600}
.close-btn{
  font-size:10.5px;font-weight:600;color:var(--text-2);
  border:1px solid var(--border-2);padding:3px 10px;border-radius:6px;
  transition:.14s;
}
.close-btn:hover{color:var(--text);border-color:#3a4b63;background:var(--panel-3)}

.empty-state{
  padding:34px 20px;text-align:center;color:var(--muted);font-size:12px;
}

/* ============================================================
   RIGHT RAIL
   ============================================================ */
.rail{background:var(--panel);overflow-y:auto;min-height:0}
.rail-section{border-bottom:1px solid var(--border)}
.rail-section:last-child{border-bottom:none}

/* ---------- ORDER FORM ---------- */
.order-form{padding:12px}
.of-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.of-tabs button{
  height:36px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text-2);background:var(--panel-2);
  border:1px solid var(--border);transition:.15s;
}
.of-tabs button:hover{color:var(--text)}
.of-tabs button.buy.active{background:var(--green);color:#04140e;border-color:var(--green);box-shadow:0 4px 14px rgba(22,199,132,.25)}
.of-tabs button.sell.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 4px 14px rgba(234,57,67,.25)}

.of-types{display:flex;gap:14px;margin-bottom:12px;padding:0 2px}
.of-types button{
  font-size:11.5px;font-weight:500;color:var(--muted);
  padding:2px 0;position:relative;transition:.14s;
}
.of-types button:hover{color:var(--text-2)}
.of-types button.active{color:var(--text)}
.of-types button.active::after{
  content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;
  background:var(--text);border-radius:2px;
}

.of-field{display:block;margin-bottom:9px}
.of-field > span{
  display:block;font-size:10.5px;color:var(--muted);
  margin-bottom:5px;font-weight:500;letter-spacing:.2px;
}
.of-input{
  display:flex;align-items:center;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:9px;height:38px;padding:0 12px;transition:.15s;
}
.of-input:focus-within{border-color:var(--border-2);background:#0b1017}
.of-input input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:13px;font-weight:500;
  min-width:0;
}
.of-input em{
  font-style:normal;font-size:11px;color:var(--muted);
  font-weight:600;letter-spacing:.3px;
}

.of-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:3px;border-radius:3px;margin:12px 0 10px;
  background:linear-gradient(90deg,var(--green) 0%,var(--green) 0%,var(--panel-3) 0%,var(--panel-3) 100%);
  outline:none;cursor:pointer;
}
.of-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;background:#fff;
  border:3px solid var(--green);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.12s;
}
.of-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.of-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:#fff;
  border:3px solid var(--green);cursor:pointer;
}

.of-pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.of-pcts button{
  height:26px;border-radius:6px;font-size:10.5px;font-weight:600;
  color:var(--text-2);background:var(--panel-2);
  border:1px solid var(--border);transition:.14s;
}
.of-pcts button:hover{color:var(--text);background:var(--panel-3);border-color:var(--border-2)}

.of-total{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0 12px;font-size:11.5px;color:var(--muted);
  border-top:1px dashed var(--border);
}
.of-total b{font-family:var(--mono);color:var(--text);font-size:12px;font-weight:500}

.of-submit{
  width:100%;height:42px;border-radius:10px;
  font-size:13.5px;font-weight:700;letter-spacing:.2px;
  transition:.16s;
}
.of-submit.buy{background:linear-gradient(135deg,#1ddb92,#12a86b);color:#04140e;box-shadow:0 6px 18px rgba(22,199,132,.22)}
.of-submit.sell{background:linear-gradient(135deg,#ff5a63,#d92832);color:#fff;box-shadow:0 6px 18px rgba(234,57,67,.22)}
.of-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
.of-submit:active{transform:translateY(0)}

/* ---------- ORDER BOOK ---------- */
.book-head{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:7px 13px;font-size:9.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;
}
.book-head span:nth-child(2),.book-head span:nth-child(3){text-align:right}

.bk-row{
  position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:3px 13px;cursor:pointer;font-family:var(--mono);font-size:11.5px;
  transition:background .1s;
}
.bk-row:hover{background:rgba(255,255,255,.035)}
.bk-row .bar{
  position:absolute;top:0;bottom:0;right:0;
  opacity:.13;transition:width .28s ease;
}
.bk-row.ask .bar{background:var(--red)}
.bk-row.bid .bar{background:var(--green)}
.bk-row span{position:relative;z-index:1}
.bk-row span:nth-child(2),.bk-row span:nth-child(3){text-align:right;color:var(--text-2)}
.bk-row.ask span:first-child{color:var(--red)}
.bk-row.bid span:first-child{color:var(--green)}

.spread-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 13px;margin:4px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  background:var(--panel-2);
}
.spread-row .sp-price{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.3px;transition:color .3s}
.spread-row .sp-price.up{color:var(--green)}
.spread-row .sp-price.down{color:var(--red)}
.spread-row .sp-label{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:600}

/* ---------- RECENT TRADES ---------- */
.tr-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:3px 13px;font-family:var(--mono);font-size:11.5px;
}
.tr-row span:nth-child(2),.tr-row span:nth-child(3){text-align:right;color:var(--text-2)}
.tr-row.up span:first-child{color:var(--green)}
.tr-row.down span:first-child{color:var(--red)}
.tr-row.new{animation:rowIn .45s ease-out}
@keyframes rowIn{from{background:rgba(61,126,255,.14)}to{background:transparent}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1280px){
  .layout{grid-template-columns:216px minmax(0,1fr) 316px}
  .chart-stats{display:none}
}
@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr) 320px}
  .watchlist{display:none}
  .mainnav{display:none}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;overflow:visible}
  .layout{display:flex;flex-direction:column;gap:1px}
  .col{overflow:visible}
  .chart-col{order:1}
  .rail{order:2}
  .chart-wrap{height:340px;flex:none}
  .bottom-panel{height:auto;max-height:280px}
  .topsearch{display:none}
  .rail{max-height:none}
  .balance{display:none}
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">$</div>
      <span>Dollar<em>Trade</em></span>
    </div>

    <nav class="mainnav">
      <a class="active">Trade</a>
      <a>Markets</a>
      <a>Portfolio</a>
      <a>Earn</a>
      <a>News</a>

<script>
/* ============================================================
   MARKET DATA
   ============================================================ */
const PAIRS = {
  'EUR/USD': { name:'Euro / US Dollar',      icon:'€$', price:1.08542, dec:5, vol:0.00042, open:1.08390, base:'EUR', quote:'USD' },
  'GBP/USD': { name:'British Pound / USD',   icon:'£$', price:1.27128, dec:5, vol:0.00045, open:1.27310, base:'GBP', quote:'USD' },
  'USD/JPY': { name:'US Dollar / Yen',       icon:'$¥', price:157.428, dec:3, vol:0.00038, open:157.120, base:'USD', quote:'JPY' },
  'AUD/USD': { name:'Aussie / US Dollar',    icon:'A$', price:0.66482, dec:5, vol:0.00050, open:0.66390, base:'AUD', quote:'USD' },
  'USD/CAD': { name:'US Dollar / Loonie',    icon:'$C', price:1.36842, dec:5, vol:0.00040, open:1.36980, base:'USD', quote:'CAD' },
  'BTC/USD': { name:'Bitcoin / US Dollar',   icon:'₿',  price:67432.50, dec:2, vol:0.0038, open:66210.00, base:'BTC', quote:'USD' },
  'ETH/USD': { name:'Ethereum / US Dollar',  icon:'Ξ',  price:3512.80, dec:2, vol:0.0045, open:3448.20, base:'ETH', quote:'USD' },
  'XAU/USD': { name:'Gold / US Dollar',      icon:'Au', price:2338.40, dec:2, vol:0.0022, open:2325.10, base:'XAU', quote:'USD' }
};

const TF_SECONDS = { '1m':60, '5m':300, '15m':900, '1h':3600, '4h':14400, '1D':86400 };

let currentPair = 'EUR/USD';
let currentTF   = '1m';
let candles     = [];
let mouse       = { x:-1, y:-1, inside:false };
let hoverIdx    = -1;
let layoutCache = null;

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function fmtPrice(p, dec){
  return p.toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function fmtNum(n, dec=2){
  return n.toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function pad2(n){ return n < 10 ? '0'+n : ''+n; }

function flashEl(el, up){
  if(!el) return;
  el.style.color = up ? 'var(--green)' : 'var(--red)';
  clearTimeout(el._flashT);
  el._flashT = setTimeout(() => { el.style.color = ''; }, 420);
}

/* ============================================================
   CANDLE GENERATION
   ============================================================ */
function generateCandles(endPrice, vol, count, intervalSec){
  const now = Date.now();
  const arr = [];
  let close = endPrice;

  for(let i = 0; i < count; i++){
    const change = (Math.random() - 0.5) * vol * 2;
    const open   = close / (1 + change);
    const high   = Math.max(open, close) * (1 + Math.random() * vol * 0.55);
    const low    = Math.min(open, close) * (1 - Math.random() * vol * 0.55);

    arr.push({
      t: now - i * intervalSec * 1000,
      open, high, low, close,
      vol: Math.random() * 80 + 20
    });
    close = open;
  }
  arr.reverse();

  // make last candle hug the live price
  const last = arr[arr.length - 1];
  last.close = endPrice;
  last.high  = Math.max(last.high, endPrice);
  last.low   = Math.min(last.low, endPrice);

  return arr;
}

function buildCandles(){
  const p  = PAIRS[currentPair];
  const tf = TF_SECONDS[currentTF];
  const vol = p.vol * Math.min(8, Math.sqrt(tf / 60));
  candles = generateCandles(p.price, vol, 150, tf);
  updateStats();
}

/* ============================================================
   CHART RENDERING
   ============================================================ */
const canvas = document.getElementById('chart');
const ctx    = canvas.getContext('2d');

function drawChart(){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if(!w || !h) return;

  if(canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width  = Math.round(w*dpr);
    canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const padR = 70, padB = 26, padT = 16, padL = 8;
  const plotW = w - padR - padL;
  const plotH = h - padB - padT;
  if(plotW <= 20 || plotH <= 20) return;

  const volH = Math.max(26, plotH * 0.15);
  const gap  = 12;
  const priceH = plotH - volH - gap;

  const total = candles.length;
  const n = Math.max(20, Math.min(total, Math.floor(plotW / 8)));
  const view = candles.slice(-n);

  let hi = -Infinity, lo = Infinity, maxVol = 0;
  for(const c of view){
    if(c.high > hi) hi = c.high;
    if(c.low  < lo) lo = c.low;
    if(c.vol  > maxVol) maxVol = c.vol;
  }
  const range = (hi - lo) || hi * 0.001;
  hi += range * 0.09;
  lo -= range * 0.09;

  const dec = PAIRS[currentPair].dec;
  const yOf = p => padT + priceH * (hi - p) / (hi - lo);
  const cw  = plotW / n;
  const xOf = i => padL + i * cw + cw / 2;

  /* ---------- GRID ---------- */
  ctx.lineWidth = 1;
  ctx.font = '11px Inter, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const gridN = 6;
  for(let i = 0; i <= gridN; i++){
    const price = hi - (hi - lo) * i / gridN;
    const y = Math.round(yOf(price)) + 0.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.042)';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();

    ctx.fillStyle = '#5f6d80';
    ctx.fillText(fmtPrice(price, dec), padL + plotW + 10, y);
  }

  /* ---------- VERTICAL GRID ---------- */
  const stepX = Math.max(1, Math.floor(n / 6));
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for(let i = 0; i < n; i += stepX){
    const x = Math.round(xOf(i)) + 0.5;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + plotH);
    ctx.stroke();
  }

  /* ---------- VOLUME ---------- */
  const volTop = padT + priceH + gap;
  for(let i = 0; i < n; i++){
    const c = view[i];
    const bh = maxVol ? (c.vol / maxVol) * volH : 0;
    const up = c.close >= c.open;
    ctx.fillStyle = up ? 'rgba(22,199,132,0.26)' : 'rgba(234,57,67,0.26)';
    const bw = Math.max(1, cw * 0.6);
    ctx.fillRect(xOf(i) - bw/2, volTop + volH - bh, bw, bh);
  }

  /* ---------- CANDLES ---------- */
  for(let i = 0; i < n; i++){
    const c = view[i];
    const x = xOf(i);
    const up = c.close >= c.open;
    const color = up ? '#16c784' : '#ea3943';

    ctx.strokeStyle = color;
    ctx.fillStyle   = color;
    ctx.lineWidth = 1;

    // wick
    ctx.beginPath();
    ctx.moveTo(Math.round(x) + 0.5, yOf(c.high));
    ctx.lineTo(Math.round(x) + 0.5, yOf(c.low));
    ctx.stroke();

    // body
    const yo = yOf(c.open);
    const yc = yOf(c.close);
    const top = Math.min(yo, yc);
    const bh  = Math.max(1, Math.abs(yc - yo));
    const bw  = Math.max(1, cw * 0.62);
    ctx.fillRect(x - bw/2, top, bw, bh);
  }

  /* ---------- TIME AXIS ---------- */
  ctx.fillStyle = '#5f6d80';
  ctx.font = '10.5px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for(let i = 0; i < n; i += stepX){
    const d = new Date(view[i].t);
    let label;
    if(TF_SECONDS[currentTF] >= 86400){
      label = `${d.getDate()}/${d.getMonth()+1}`;
    } else {
      label = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    ctx.fillText(label, xOf(i), padT + plotH + 8);
  }

  /* ---------- LAST PRICE LINE ---------- */
  const last = view[n - 1];
  const lastUp = last.close >= last.open;
  const lastColor = lastUp ? '#16c784' : '#ea3943';
  const yLast = yOf(last.close);

  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = lastColor;
  ctx.globalAlpha = 0.65;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, Math.round(yLast) + 0.5);
  ctx.lineTo(padL + plotW, Math.round(yLast) + 0.5);
  ctx.stroke();
  ctx.restore();

  // price tag
  const tagH = 19;
  ctx.fillStyle = lastColor;
  ctx.beginPath();
  const tx = padL + plotW + 2, ty = yLast - tagH/2, tw = padR - 6, th = tagH, r = 4;
  ctx.moveTo(tx + r, ty);
  ctx.lineTo(tx + tw - r, ty);
  ctx.quadraticCurveTo(tx + tw, ty, tx + tw, ty + r);
  ctx.lineTo(tx + tw, ty + th - r);
  ctx.quadraticCurveTo(tx + tw, ty + th, tx + tw - r, ty + th);
  ctx.lineTo(tx + r, ty + th);
  ctx.quadraticCurveTo(tx, ty + th, tx, ty + th - r);
  ctx.lineTo(tx, ty + r);
  ctx.quadraticCurveTo(tx, ty, tx + r, ty);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#080b12';
  ctx.font = '700 11px JetBrains Mono, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(fmtPrice(last.close, dec), tx + 8, yLast + 0.5);

  /* ---------- CROSSHAIR ---------- */
  if(mouse.inside && mouse.x > padL && mouse.x < padL + plotW && mouse.y > padT && mouse.y < padT + plotH){
    const idx = Math.min(n - 1, Math.max(0, Math.floor((mouse.x - padL) / cw)));
    const cx  = Math.round(xOf(idx)) + 0.5;
    const cy  = Math.round(mouse.y) + 0.5;

    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(170,195,230,0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(padL + plotW, cy); ctx.stroke();
    ctx.restore();

    // hover price tag
    const hoverPrice = hi - (cy - padT) / priceH * (hi - lo);
    ctx.fillStyle = '#2a3446';
    ctx.beginPath();
    const hx = padL + plotW + 2, hy = cy - 9, hw = padR - 6, hh = 18, hr = 4;
    ctx.moveTo(hx + hr, hy);
    ctx.lineTo(hx + hw - hr, hy);
    ctx.quadraticCurveTo(hx + hw, hy, hx + hw, hy + hr);
    ctx.lineTo(hx + hw, hy + hh - hr);
    ctx.quadraticCurveTo(hx + hw, hy + hh, hx + hw - hr, hy + hh);
    ctx.lineTo(hx + hr, hy + hh);
    ctx.quadraticCurveTo(hx, hy + hh, hx, hy + hh - hr);
    ctx.lineTo(hx, hy + hr);
    ctx.quadraticCurveTo(hx, hy, hx + hr, hy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#dbe4f0';
    ctx.font = '600 11px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(fmtPrice(hoverPrice, dec), hx + 8, cy + 0.5);

    // update legend with hovered candle
    if(hoverIdx !== idx){
      hoverIdx = idx;
      updateLegend(view[idx]);
    }
  } else if(hoverIdx !== -1){
    hoverIdx = -1;
    updateLegend(view[n - 1]);
  }

  layoutCache = { padL, padT, plotW, priceH, cw, n, view, hi, lo, dec };
}

function updateLegend(c){
  if(!c) return;
  const dec = PAIRS[currentPair].dec;
  $('#lgO').textContent = fmtPrice(c.open,  dec);
  $('#lgH').textContent = fmtPrice(c.high,  dec);
  $('#lgL').textContent = fmtPrice(c.low,   dec);
  $('#lgC').textContent = fmtPrice(c.close, dec);
  $('#lgV').textContent = fmtNum(c.vol, 1);
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats(){
  if(!candles.length) return;
  let hi = -Infinity, lo = Infinity, vol = 0;
  const slice = candles.slice(-60);
  for(const c of slice){
    hi = Math.max(hi, c.high);
    lo = Math.min(lo, c.low);
    vol += c.vol;
  }
  const dec = PAIRS[currentPair].dec;
  $('#statHigh').textContent = fmtPrice(hi, dec);
  $('#statLow').textContent  = fmtPrice(lo, dec);
  $('#statVol').textContent  = (vol / 1000).toFixed(2) + 'K';
}

/* ============================================================
   WATCHLIST
   ============================================================ */
function buildWatchlist(){
  const list = $('#wlList');
  list.innerHTML = '';
  Object.entries(PAIRS).forEach(([sym, p]) => {
    const chg = (p.price / p.open - 1) * 100;
    const row = document.createElement('div');
    row.className = 'wl-row' + (sym === currentPair ? ' active' : '');
    row.dataset.pair = sym;
    row.innerHTML = `
      <div class="wl-sym">
        <b>${sym}</b>
        <small>${p.name}</small>
      </div>
      <div class="wl-right">
        <span class="wl-price" data-price="${sym}">${fmtPrice(p.price, p.dec)}</span>
        <span class="wl-chg ${chg >= 0 ? 'up' : 'down'}" data-chg="${sym}">
          ${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%
        </span>
      </div>`;
    row.addEventListener('click', () => switchPair(sym));
    list.appendChild(row);
  });
  $('#wlCount').textContent = Object.keys(PAIRS).length;
}

function refreshWatchlist(){
  for(const sym in PAIRS){
    const p = PAIRS[sym];
    const priceEl = document.querySelector(`[data-price="${sym}"]`);
    const chgEl   = document.querySelector(`[data-chg="${sym}"]`);
    if(!priceEl) continue;

    const prev = parseFloat(priceEl.textContent.replace(/,/g, ''));
    const up = p.price >= prev;
    priceEl.textContent = fmtPrice(p.price, p.dec);
    flashEl(priceEl, up);

    const chg = (p.price / p.open - 1) * 100;
    chgEl.textContent = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`;
    chgEl.className = 'wl-chg ' + (chg >= 0 ? 'up' : 'down');
  }
}

/* ============================================================
   TICKER STRIP
   ============================================================ */
function buildTicker(){
  const track = $('#tickerTrack');
  let html = '';
  for(const sym in PAIRS){
    const p = PAIRS[sym];
    const chg = (p.price / p.open - 1) * 100;
    html += `<div class="tick-item">
      <span class="sym">${sym}</span>
      <span data-tick-price="${sym}">${fmtPrice(p.price, p.dec)}</span>
      <span class="${chg >= 0 ? 'up' : 'down'}" data-tick-chg="${sym}">
        ${chg >= 0 ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)}%
      </span>
    </div>`;
  }
  track.innerHTML = html + html; // duplicate for seamless loop
}

function refreshTicker(){
  for(const sym in PAIRS){
    const p = PAIRS[sym];
    const chg = (p.price / p.open - 1) * 100;
    document.querySelectorAll(`[data-tick-price="${sym}"]`).forEach(el => {
      el.textContent = fmtPrice(p.price, p.dec);
      el.style.color = chg >= 0 ? 'var(--text)' : 'var(--text)';
    });
    document.querySelectorAll(`[data-tick-chg="${sym}"]`).forEach(el => {
      el.className = chg >= 0 ? 'up' : 'down';
      el.textContent = `${chg >= 0 ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)}%`;
    });
  }
}

/* ============================================================
   ORDER BOOK
   ============================================================ */
function renderBook(){
  const p = PAIRS[currentPair];
  const mid = p.price;
  const tick = mid * p.vol * 0.16;
  const dec = p.dec;

  const LEVELS = 8;
  let askHtml = '', bidHtml = '';
  let askTotal = 0, bidTotal = 0;

  const asks = [];
  for(let i = LEVELS; i >= 1; i--){
    const price = mid + tick * i;
    const size = Math.random() * 3.2 + 0.15;
    askTotal += size;
    asks.push({ price, size, total: askTotal });
  }
  const maxAskTotal = askTotal;

  const bids = [];
  for(let i = 1; i <= LEVELS; i++){
    const price = mid - tick * i;
    const size = Math.random() * 3.2 + 0.15;
    bidTotal += size;
    bids.push({ price, size, total: bidTotal });
  }
  const maxBidTotal = bidTotal;

  asks.forEach(a => {
    const w = (a.total / maxAskTotal) * 100;
    askHtml += `<div class="bk-row ask">
      <div class="bar" style="width:${w}%"></div>
      <span>${fmtPrice(a.price, dec)}</span>
      <span>${a.size.toFixed(3)}</span>
      <span>${a.total.toFixed(3)}</span>
    </div>`;
  });

  bids.forEach(b => {
    const w = (b.total / maxBidTotal) * 100;
    bidHtml += `<div class="bk-row bid">
      <div class="bar" style="width:${w}%"></div>
      <span>${fmtPrice(b.price, dec)}</span>
      <span>${b.size.toFixed(3)}</span>
      <span>${b.total.toFixed(3)}</span>
    </div>`;
  });

  $('#bookAsks').innerHTML = askHtml;
  $('#bookBids').innerHTML = bidHtml;

  const spread = (tick * 2).toFixed(dec > 3 ? 4 : 2);
  $('#spreadLabel').textContent = `Spread ${spread}`;
}

/* ============================================================
   RECENT TRADES
   ============================================================ */
function pushTrade(prepend = true){
  const p = PAIRS[currentPair];
  const list = $('#tradeList');
  const up = Math.random() > 0.5;
  const size = (Math.random() * 2.4 + 0.02).toFixed(3);
  const now = new Date();

  const row = document.createElement('div');
  row.className = 'tr-row ' + (up ? 'up' : 'down') + (prepend ? ' new' : '');
  row.innerHTML = `
    <span>${fmtPrice(p.price, p.dec)}</span>
    <span>${size}</span>
    <span>${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}</span>
  `;

  if(prepend){
    list.prepend(row);
    while(list.children.length > 24) list.removeChild(list.lastChild);
  } else {
    list.appendChild(row);
  }
}

function seedTrades(){
  const list = $('#tradeList');
  list.innerHTML = '';
  const p = PAIRS[currentPair];
  for(let i = 0; i < 20; i++){
    const up = Math.random() > 0.5;
    const d = new Date(Date.now() - (20 - i) * 3000);
    const row = document.createElement('div');
    row.className = 'tr-row ' + (up ? 'up' : 'down');
    row.innerHTML = `
      <span>${fmtPrice(p.price * (1 + (Math.random() - 0.5) * 0.0004), p.dec)}</span>
      <span>${(Math.random() * 2.4 + 0.02).toFixed(3)}</span>
      <span>${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}</span>
    `;
    list.appendChild(row);
  }
}

/* ============================================================
   POSITIONS TABLE
   ============================================================ */
const positions = [
  { sym:'EUR/USD', side:'Long',  size:50000,  entry:1.08420, margin:542.10 },
  { sym:'BTC/USD', side:'Short', size:0.35,   entry:68120.00, margin:1186.40 }
];

function renderPositions(){
  const body = $('#bpBody');
  if(!positions.length){
    body.innerHTML = `<div class="empty-state">No open positions</div>`;
    $('#posCount').textContent = '0';
    return;
  }

  let rows = '';
  positions.forEach((pos, i) => {
    const p = PAIRS[pos.sym];
    const mark = p.price;
    const dir = pos.side === 'Long' ? 1 : -1;
    const pnl = (mark - pos.entry) * pos.size * dir;
    const pnlPct = (pnl / pos.margin) * 100;

    rows += `<tr>
      <td class="sym-cell">${pos.sym}</td>
      <td><span class="side-tag ${pos.side.toLowerCase()}">${pos.side}</span></td>
      <td class="num">${pos.size.toLocaleString('en-US', {maximumFractionDigits:4})}</td>
      <td class="num">${fmtPrice(pos.entry, p.dec)}</td>
      <td class="num">${fmtPrice(mark, p.dec)}</td>
      <td class="num ${pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">
        ${pnl >= 0 ? '+' : '-'}$${fmtNum(Math.abs(pnl))} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)
      </td>
      <td class="num">$${fmtNum(pos.margin)}</td>
      <td style="text-align:right"><button class="close-btn" data-close="${i}">Close</button></td>
    </tr>`;
  });

  body.innerHTML = `<table>
    <thead><tr>
      <th>Symbol</th><th>Side</th><th class="num">Size</th><th class="num">Entry</th>
      <th class="num">Mark</th><th class="num">Unrealized PnL</th><th class="num">Margin</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  $('#posCount').textContent = positions.length;

  $$('[data-close]', body).forEach(btn => {
    btn.addEventListener('click', () => {
      positions.splice(+btn.dataset.close, 1);
      renderPositions();
    });
  });
}

/* ============================================================
   PAIR SWITCHING
   ============================================================ */
function switchPair(sym){
  if(sym === currentPair) return;
  currentPair = sym;
  const p = PAIRS[sym];

  $$('.wl-row').forEach(r => r.classList.toggle('active', r.dataset.pair === sym));

  $('#pairName').textContent = sym;
  $('#pairSub').textContent  = p.name;
  $('#pairIcon').textContent = p.icon;
  $('#ofQuote').textContent  = p.quote;
  $('#ofBase').textContent   = p.base;
  $('#ofSubmit').textContent = `${$('#ofSubmit').classList.contains('buy') ? 'Buy' : 'Sell'} ${sym}`;

  buildCandles();
  renderBook();
  seedTrades();
  refreshHeadline(true);
  drawChart();
}

/* ============================================================
   HEADLINE PRICE
   ============================================================ */
function refreshHeadline(force = false){
  const p = PAIRS[currentPair];
  const dec = p.dec;
  const priceEl = $('#bigPrice');
  const prevText = priceEl.textContent.replace(/,/g, '');
  const prev = parseFloat(prevText);

  priceEl.textContent = fmtPrice(p.price, dec);
  if(!isNaN(prev) && !force){
    flashEl(priceEl, p.price >= prev);
  }

  const chg = (p.price / p.open - 1) * 100;
  const chgEl = $('#priceChg');
  chgEl.textContent = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%  ${chg >= 0 ? '▲' : '▼'}`;
  chgEl.className = 'price-chg ' + (chg >= 0 ? 'up' : 'down');

  const sp = $('#spreadPrice');
  sp.textContent = fmtPrice(p.price, dec);
  sp.className = 'sp-price ' + (chg >= 0 ? 'up' : 'down');

  // sync order form price if user hasn't typed
  if(!$('#ofPrice').dataset.dirty){
    $('#ofPrice').value = p.price.toFixed(dec);
  }
}

/* ============================================================
   LIVE TICK ENGINE
   ============================================================ */
let tickCount = 0;

function tick(){
  tickCount++;

  // update every pair
  for(const sym in PAIRS){
    const p = PAIRS[sym];
    const move = p.price * p.vol * 0.30 * (Math.random() * 2 - 1);
    p.price = Math.max(p.price * 0.5, p.price + move);
  }

  // update live candle
  const p = PAIRS[currentPair];
  const last = candles[candles.length - 1];
  if(last){
    last.close = p.price;
    last.high  = Math.max(last.high, p.price);
    last.low   = Math.min(last.low, p.price);
    last.vol  += Math.random() * 6;
  }

  // roll a new candle every ~9 ticks
  if(tickCount % 9 === 0){
    const tf = TF_SECONDS[currentTF];
    candles.push({
      t: Date.now(),
      open: p.price,
      high: p.price,
      low: p.price,
      close: p.price,
      vol: Math.random() * 20 + 5
    });
    if(candles.length > 200) candles.shift();
  }

  refreshHeadline();
  refreshWatchlist();
  refreshTicker();
  renderBook();
  pushTrade();
  updateStats();
  drawChart();
  updatePositionsPnL();
}

function updatePositionsPnL(){
  if($('#bpBody').querySelector('table')){
    // light update of pnl cells only
    const rows = $$('#bpBody tbody tr');
    rows.forEach((tr, i) => {
      const pos = positions[i];
      if(!pos) return;
      const p = PAIRS[pos.sym];
      const dir = pos.side === 'Long' ? 1 : -1;
      const pnl = (p.price - pos.entry) * pos.size * dir;
      const pnlPct = (pnl / pos.margin) * 100;
      const cell = tr.children[5];
      const markCell = tr.children[4];
      if(cell){
        cell.className = 'num ' + (pnl >= 0 ? 'pnl-pos' : 'pnl-neg');
        cell.textContent = `${pnl >= 0 ? '+' : '-'}$${fmtNum(Math.abs(pnl))} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)`;
      }
      if(markCell) markCell.textContent = fmtPrice(p.price, p.dec);
    });
  }
}

/* ============================================================
   ORDER FORM INTERACTIONS
   ============================================================ */
const ofPrice  = $('#ofPrice');
const ofAmount = $('#ofAmount');
const ofSlider = $('#ofSlider');
const ofSubmit = $('#ofSubmit');

ofPrice.addEventListener('input', () => { ofPrice.dataset.dirty = '1'; updateTotal(); });
ofAmount.addEventListener('input', () => { ofSlider.value = 0; updateSliderFill(); updateTotal(); });

ofSlider.addEventListener('input', () => {
  const pct = +ofSlider.value;
  const balance = 48250.75;
  const p = PAIRS[currentPair];
  const notional = balance * (pct / 100) * 5; // 5x leverage
  const amt = notional / p.price;
  ofAmount.value = amt.toFixed(p.dec > 3 ? 4 : 6);
  updateSliderFill();
  updateTotal();
});

function updateSliderFill(){
  const v = +ofSlider.value;
  ofSlider.style.background =
    `linear-gradient(90deg, var(--green) 0%, var(--green) ${v}%, var(--panel-3) ${v}%, var(--panel-3) 100%)`;
}

function updateTotal(){
  const p = PAIRS[currentPair];
  const price = parseFloat(ofPrice.value.replace(/,/g, '')) || p.price;
  const amt = parseFloat(ofAmount.value) || 0;
  $('#ofTotal').textContent = `${fmtNum(price * amt)} ${p.quote}`;
}

$$('#ofPcts button').forEach(btn => {
  btn.addEventListener('click', () => {
    const pct = +btn.dataset.pct;
    ofSlider.value = pct;
    ofSlider.dispatchEvent(new Event('input'));
  });
});

$$('#ofTabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#ofTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const side = btn.dataset.side;
    ofSubmit.className = 'of-submit ' + side;
    ofSubmit.textContent = `${side === 'buy' ? 'Buy' : 'Sell'} ${currentPair}`;
  });
});

$$('#ofTypes button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#ofTypes button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ofPrice.disabled = btn.textContent === 'Market';
    ofPrice.style.opacity = ofPrice.disabled ? '.45' : '1';
  });
});

ofSubmit.addEventListener('click', () => {
  const isBuy = ofSubmit.classList.contains('buy');
  ofSubmit.textContent = 'Placing order…';
  ofSubmit.style.opacity = '.75';
  setTimeout(() => {
    ofSubmit.textContent = `${isBuy ? 'Buy' : 'Sell'} ${currentPair}`;
    ofSubmit.style.opacity = '1';
  }, 700);
});

/* ============================================================
   TIMEFRAME BAR

$$('#tfBar button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#tfBar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

/* ============================================================
   WATCHLIST SEARCH
   ============================================================ */
$('#wlSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  $$('.wl-row').forEach(row => {
    const sym = row.dataset.pair.toLowerCase();
    const name = PAIRS[row.dataset.pair].name.toLowerCase();
    row.style.display = (!q || sym.includes(q) || name.includes(q)) ? '' : 'none';
  });
});

/* ============================================================
   CHART MOUSE EVENTS
   ============================================================ */
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.inside = true;
  drawChart();
});
canvas.addEventListener('mouseleave', () => {
  mouse.inside = false;
  hoverIdx = -1;
  drawChart();
});

/* ============================================================
   RESIZE
   ============================================================ */
let resizeRAF;
const ro = new ResizeObserver(() => {
  cancelAnimationFrame(resizeRAF);
  resizeRAF = requestAnimationFrame(drawChart);
});
ro.observe(document.getElementById('chartWrap'));
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeRAF);
  resizeRAF = requestAnimationFrame(drawChart);
});

/* ============================================================
   BOOT
   ============================================================ */
function init(){
  buildWatchlist();
  buildTicker();
  buildCandles();
  renderBook();
  seedTrades();
  refreshHeadline(true);
  refreshTicker();
  updateSliderFill();
  updateTotal();
  renderPositions();

  requestAnimationFrame(() => {
    drawChart();
    setTimeout(drawChart, 60);
  });

  // live loop
  setInterval(tick, 1000);

  // extra trade stream (feels busier)
  setInterval(() => { if(Math.random() > 0.35) pushTrade(); }, 1400);
}

init();
</script>
